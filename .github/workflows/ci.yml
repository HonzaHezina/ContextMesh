name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      graphiti_live:
        description: Run the paid Graphiti/model stack test (needs repository secrets)
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --extra graphiti
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
      - name: Prepare non-secret environment for Compose validation
        run: cp .env.example .env
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.graph.yaml config --quiet
        env:
          MEMORY_NEO4J_PASSWORD: ci-only-not-a-real-secret
      - run: docker build -t active-memory:ci .
      - name: Installed image serves its UI files
        run: >-
          docker run --rm --entrypoint python active-memory:ci -c
          "import active_memory,pathlib;u=pathlib.Path(active_memory.__file__).parent/'ui';
          missing=[n for n in ('index.html','app.js','logic.js','app.css','shell.js','review.js','review_logic.js','conv.js','timeline.js','graph.js','settings.js','paste.js','paste_logic.js','graph_logic.js','cytoscape.min.js','cytoscape.LICENSE','graph3d.js','3d-force-graph.min.js','3d-force-graph.LICENSE') if not (u/n).is_file()];
          assert not missing, missing"
  native-graph:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.31-community
        env:
          NEO4J_AUTH: neo4j/ci-only-not-a-real-secret
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474/"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -q tests/test_live_graph.py -k native
        env:
          MEMORY_TEST_NEO4J: 'true'
          MEMORY_TEST_NEO4J_PASSWORD: ci-only-not-a-real-secret
  docker-stack:
    # Keyless: the real image + Neo4j through Compose, no model call, no cost.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync pytest -q tests/test_stack_integration.py -k native_graph
        env:
          MEMORY_TEST_DOCKER: 'true'
  graphiti-live:
    # Paid provider: never on push/PR. Manual (workflow_dispatch with graphiti_live) or weekly.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.graphiti_live)
    runs-on: ubuntu-latest
    env:
      MEMORY_TEST_MODEL_KEY: ${{ secrets.MEMORY_TEST_MODEL_KEY }}
      MEMORY_TEST_EMBEDDING_KEY: ${{ secrets.MEMORY_TEST_EMBEDDING_KEY }}
      MEMORY_TEST_MODEL_URL: ${{ vars.MEMORY_TEST_MODEL_URL }}
      MEMORY_TEST_EMBEDDING_URL: ${{ vars.MEMORY_TEST_EMBEDDING_URL }}
      MEMORY_TEST_MODEL_NAME: ${{ vars.MEMORY_TEST_MODEL_NAME }}
      MEMORY_TEST_EMBEDDING_MODEL: ${{ vars.MEMORY_TEST_EMBEDDING_MODEL }}
      MEMORY_TEST_EMBEDDING_DIM: ${{ vars.MEMORY_TEST_EMBEDDING_DIM }}
    steps:
      - name: Skip without provider secrets
        id: gate
        run: |
          if [ -z "$MEMORY_TEST_MODEL_KEY" ] || [ -z "$MEMORY_TEST_EMBEDDING_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MEMORY_TEST_MODEL_KEY / MEMORY_TEST_EMBEDDING_KEY not configured; skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen --extra dev
      - if: steps.gate.outputs.run == 'true'
        run: uv run --no-sync pytest -q tests/test_stack_integration.py -k graphiti
        env:
          MEMORY_TEST_DOCKER_GRAPHITI: 'true'
      - if: steps.gate.outputs.run == 'true'
        name: Link proposals with real embeddings and judge on the fixed dataset
        run: uv run --no-sync python scripts/run_eval.py --proposals --embeddings --judge --output eval-report.json
        env:
          MEMORY_MODEL_API_KEY: ${{ secrets.MEMORY_TEST_MODEL_KEY }}
          MEMORY_EMBEDDING_API_KEY: ${{ secrets.MEMORY_TEST_EMBEDDING_KEY }}
          MEMORY_MODEL_BASE_URL: ${{ vars.MEMORY_TEST_MODEL_URL || 'https://api.openai.com/v1' }}
          MEMORY_EMBEDDING_BASE_URL: ${{ vars.MEMORY_TEST_EMBEDDING_URL || 'https://api.openai.com/v1' }}
          MEMORY_MODEL_NAME: ${{ vars.MEMORY_TEST_MODEL_NAME || 'gpt-6-luna' }}
          MEMORY_EMBEDDING_MODEL: ${{ vars.MEMORY_TEST_EMBEDDING_MODEL || 'text-embedding-3-small' }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
